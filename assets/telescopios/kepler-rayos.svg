<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" role="img" aria-labelledby="title desc">
<title id="title">Telescopio kepleriano: dos lentes convergentes y plano focal compartido</title>
<desc id="desc">Tres rayos paralelos de un mismo punto lejano llegan al objetivo convergente con inclinación θ. Se cruzan en un único punto del plano focal compartido, a una altura f sub o por θ debajo del eje: es un punto de la imagen real intermedia. Los tres rayos forman la imagen de un único punto del objeto. Siguen en línea recta hasta el ocular convergente y salen paralelos con inclinación θ′ = −4θ, en sentido opuesto.</desc>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1d3557" stroke-opacity=".05"/></pattern>
<linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#f7fcff"/><stop offset=".5" stop-color="#bcdcea"/><stop offset="1" stop-color="#f7fcff"/></linearGradient>
<linearGradient id="glassV" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f7fcff"/><stop offset=".5" stop-color="#bcdcea"/><stop offset="1" stop-color="#f7fcff"/></linearGradient>
<linearGradient id="mirror" x1="0" x2="1"><stop offset="0" stop-color="#e9eef2"/><stop offset=".45" stop-color="#9fb0bd"/><stop offset="1" stop-color="#4b5d6b"/></linearGradient>
<linearGradient id="tube" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1d3557" stop-opacity=".09"/><stop offset=".5" stop-color="#1d3557" stop-opacity=".025"/><stop offset="1" stop-color="#1d3557" stop-opacity=".09"/></linearGradient>
<style>
text{font-family:"Segoe UI",Arial,sans-serif;fill:#1d3557;font-size:18px}
.t{font-size:23px;font-weight:700}.b{font-weight:700}.s{font-size:16px;fill:#5c6b75}.i{font-style:italic}
.pill{font-size:15px;font-weight:700;fill:#7a4b06}.g{font-family:Georgia,serif;font-style:italic;font-size:21px}
.axis{stroke:#8795a0;stroke-width:1.4;stroke-dasharray:10 7}
.ray{fill:none;stroke:#c8640f;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.ghost{fill:none;stroke:#c8640f;stroke-width:1.8;stroke-dasharray:5 6;stroke-opacity:.55}
.beam{fill:#f2c230;fill-opacity:.2}
.lens{fill:url(#glass);stroke:#1d3557;stroke-width:2.4}
.lensV{fill:url(#glassV);stroke:#1d3557;stroke-width:2.4}
.lead{fill:none;stroke:#1d3557;stroke-width:1.3}
.ref{stroke:#5c6b75;stroke-width:1.3;stroke-dasharray:4 4}
.arc{fill:none;stroke:#1d3557;stroke-width:2}
.plane{stroke:#1d3557;stroke-width:1.6;stroke-dasharray:3 6;stroke-opacity:.7}
.tube{fill:url(#tube);stroke:#1d3557;stroke-opacity:.35;stroke-width:1.5}
.dim{stroke:#1d3557;stroke-width:1.6;fill:none}
</style></defs>
<rect width="1000" height="545" rx="14" fill="#fffdf7"/><rect width="1000" height="545" rx="14" fill="url(#grid)"/>
<rect x="0" y="0" width="8" height="545" fill="#f2c230"/>
<text class="t" x="34" y="46">Kepler: la luz se cruza antes del ocular</text><rect x="760" y="26" width="206" height="28" rx="14" fill="#fff6d8" stroke="#e0b84a"/><text class="pill" x="863" y="45" text-anchor="middle">imagen real intermedia</text><rect x="590" y="26" width="160" height="28" rx="14" fill="#fff6d8" stroke="#e0b84a"/><text class="pill" x="670" y="45" text-anchor="middle">imagen invertida</text><path class="tube" d="M178 168H648V186H736V374H648V392H178Z"/><line class="axis" x1="28" y1="280" x2="975" y2="280"/><text class="s" x="905" y="304">eje óptico</text><line class="plane" x1="600" y1="150" x2="600" y2="410"/><path class="beam" d="M40 184L200 200L200 360L40 344Z"/><path class="beam" d="M200 200L600 320L200 360Z"/><path class="beam" d="M600 320L700 350L700 310Z"/><path class="beam" d="M700 350L945 252L945 212L700 310Z"/><path class="ray" d="M40 184L200 200L600 320L700 350L945 252"/><path d="M128 192.8L116.5 197L117.6 186.5Z" fill="#c8640f"/><path d="M420 266L407.9 267.9L411 257.8Z" fill="#c8640f"/><path d="M655 336.5L642.9 338.4L646 328.3Z" fill="#c8640f"/><path d="M834.8 296.1L826.5 305.1L822.6 295.3Z" fill="#c8640f"/><path class="ray" d="M40 264L200 280L600 320L700 330L945 232"/><path d="M128 272.8L116.5 277L117.6 266.5Z" fill="#c8640f"/><path d="M420 302L408.5 306.2L409.6 295.7Z" fill="#c8640f"/><path d="M655 325.5L643.5 329.7L644.6 319.2Z" fill="#c8640f"/><path d="M834.8 276.1L826.5 285.1L822.6 275.3Z" fill="#c8640f"/><path class="ray" d="M40 344L200 360L600 320L700 310L945 212"/><path d="M128 352.8L116.5 357L117.6 346.5Z" fill="#c8640f"/><path d="M420 338L409.6 344.3L408.5 333.8Z" fill="#c8640f"/><path d="M655 314.5L644.6 320.8L643.5 310.3Z" fill="#c8640f"/><path d="M834.8 256.1L826.5 265.1L822.6 255.3Z" fill="#c8640f"/><path d="M600 280V318" stroke="#1d3557" stroke-width="3.2"/><path d="M600 324L595.2 314L604.8 314Z" fill="#1d3557"/><circle cx="600" cy="320" r="5" fill="#1d3557"/><text class="g" x="590" y="271" text-anchor="end" style="font-size:18px">y<tspan baseline-shift="sub" font-size="12">f</tspan> = f<tspan baseline-shift="sub" font-size="12">o</tspan>θ</text><path class="lens" d="M200 152Q232 280 200 408Q168 280 200 152Z"/><path class="lens" d="M700 192Q726 280 700 368Q674 280 700 192Z"/><text class="b" x="224" y="130">Objetivo convergente</text><text class="g" x="224" y="156">f<tspan baseline-shift="sub" font-size="14">o</tspan> &gt; 0</text><text class="b" x="700" y="114" text-anchor="middle">Ocular convergente</text><text class="g" x="700" y="140" text-anchor="middle">f<tspan baseline-shift="sub" font-size="14">e</tspan> &gt; 0</text><path class="lead" d="M700 150V190"/><text class="b" x="290" y="384" data-etiqueta="punto-imagen">Punto de la imagen real intermedia</text><text class="s" x="290" y="405" data-etiqueta="un-punto">Los tres rayos forman la imagen</text><text class="s" x="290" y="424">de un único punto del objeto.</text><path class="lead" d="M562 366L594 326"/><text class="s" x="600" y="430" text-anchor="middle">plano focal compartido</text><path d="M48 65L51.4 73.3L60.4 74L53.6 79.8L55.6 88.5L48 83.9L40.4 88.5L42.4 79.8L35.6 74L44.6 73.3Z" fill="#f2c230" stroke="#b17a10" stroke-width="1.5"/><text class="b" x="70" y="84">Luz de un mismo punto lejano</text><text class="s" x="70" y="105">rayos paralelos entre sí, inclinados</text><line class="ref" x1="60" y1="186" x2="186" y2="186"/><path class="arc" d="M156 186A96 96 0 0 1 155.5 195.6"/><text class="g" x="168" y="188">θ</text><line class="ref" x1="775" y1="280" x2="775" y2="280"/><path class="arc" d="M867 280A92 92 0 0 0 860.4 245.8"/><text class="g" x="873" y="268">θ′</text><text class="b" x="760" y="372">Sale paralelo,</text><text class="s" x="760" y="393">inclinado al revés:</text><text class="g" x="760" y="423" data-relacion="angulo">θ′ ≈ −(f<tspan baseline-shift="sub" font-size="14">o</tspan>/f<tspan baseline-shift="sub" font-size="14">e</tspan>) θ = −4θ</text><path class="dim" d="M200 462H700M200 454V470M600 456V468M700 454V470"/><path d="M200 462L209 457.7L209 466.3Z" fill="#1d3557"/><path d="M700 462L691 466.3L691 457.7Z" fill="#1d3557"/><text class="g" x="400" y="455" text-anchor="middle">f<tspan baseline-shift="sub" font-size="14">o</tspan></text><text class="g" x="650" y="455" text-anchor="middle">f<tspan baseline-shift="sub" font-size="14">e</tspan></text><text class="b" x="450" y="492" text-anchor="middle">d = f<tspan baseline-shift="sub" font-size="13">o</tspan> + f<tspan baseline-shift="sub" font-size="13">e</tspan></text><text class="s i" x="34" y="526">Ángulos positivos hacia arriba: θ &lt; 0 y θ′ &gt; 0. Ángulos exagerados para que se vean: no está a escala.</text>
</svg>
