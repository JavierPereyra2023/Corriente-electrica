<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" role="img" aria-labelledby="title desc">
<title id="title">Telescopio galileano: objetivo convergente y ocular divergente</title>
<desc id="desc">Tres rayos paralelos de un mismo punto lejano llegan al objetivo convergente, de focal 40 cm, con inclinación θ. El objetivo los dirige hacia un punto de su plano focal situado a f sub o por θ del eje, pero el ocular divergente, de focal −10 cm y ubicado a 30 cm, los intercepta antes. Líneas punteadas muestran dónde se reunirían sin ocular. Salen paralelos con θ′ = +4θ, del mismo signo: imagen derecha y sin imagen real intermedia.</desc>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1d3557" stroke-opacity=".05"/></pattern>
<linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#f7fcff"/><stop offset=".5" stop-color="#bcdcea"/><stop offset="1" stop-color="#f7fcff"/></linearGradient>
<linearGradient id="glassV" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f7fcff"/><stop offset=".5" stop-color="#bcdcea"/><stop offset="1" stop-color="#f7fcff"/></linearGradient>
<linearGradient id="mirror" x1="0" x2="1"><stop offset="0" stop-color="#e9eef2"/><stop offset=".45" stop-color="#9fb0bd"/><stop offset="1" stop-color="#4b5d6b"/></linearGradient>
<linearGradient id="tube" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1d3557" stop-opacity=".09"/><stop offset=".5" stop-color="#1d3557" stop-opacity=".025"/><stop offset="1" stop-color="#1d3557" stop-opacity=".09"/></linearGradient>
<style>
text{font-family:"Segoe UI",Arial,sans-serif;fill:#1d3557;font-size:18px}
.t{font-size:23px;font-weight:700}.b{font-weight:700}.s{font-size:16px;fill:#5c6b75}.i{font-style:italic}
.pill{font-size:15px;font-weight:700;fill:#7a4b06}.g{font-family:Georgia,serif;font-style:italic;font-size:21px}
.axis{stroke:#8795a0;stroke-width:1.4;stroke-dasharray:10 7}
.ray{fill:none;stroke:#c8640f;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.ghost{fill:none;stroke:#c8640f;stroke-width:1.8;stroke-dasharray:5 6;stroke-opacity:.55}
.beam{fill:#f2c230;fill-opacity:.2}
.lens{fill:url(#glass);stroke:#1d3557;stroke-width:2.4}
.lensV{fill:url(#glassV);stroke:#1d3557;stroke-width:2.4}
.lead{fill:none;stroke:#1d3557;stroke-width:1.3}
.ref{stroke:#5c6b75;stroke-width:1.3;stroke-dasharray:4 4}
.arc{fill:none;stroke:#1d3557;stroke-width:2}
.plane{stroke:#1d3557;stroke-width:1.6;stroke-dasharray:3 6;stroke-opacity:.7}
.tube{fill:url(#tube);stroke:#1d3557;stroke-opacity:.35;stroke-width:1.5}
.dim{stroke:#1d3557;stroke-width:1.6;fill:none}
</style></defs>
<rect width="1000" height="545" rx="14" fill="#fffdf7"/><rect width="1000" height="545" rx="14" fill="url(#grid)"/>
<rect x="0" y="0" width="8" height="545" fill="#f2c230"/>
<text class="t" x="34" y="46">Galileo: el ocular divergente intercepta la luz</text><rect x="730" y="26" width="236" height="28" rx="14" fill="#fff6d8" stroke="#e0b84a"/><text class="pill" x="848" y="45" text-anchor="middle">sin imagen real intermedia</text><rect x="570" y="26" width="150" height="28" rx="14" fill="#fff6d8" stroke="#e0b84a"/><text class="pill" x="645" y="45" text-anchor="middle">imagen derecha</text><path class="tube" d="M178 168H472V214H534V346H472V392H178Z"/><line class="axis" x1="28" y1="280" x2="975" y2="280"/><text class="s" x="905" y="271">eje óptico</text><line class="plane" x1="600" y1="176" x2="600" y2="398"/><text class="b" x="608" y="166" style="font-size:16px">Plano focal del objetivo</text><text class="g" x="608" y="192" style="font-size:18px" data-etiqueta="yF">y<tspan baseline-shift="sub" font-size="12">f</tspan> = f<tspan baseline-shift="sub" font-size="12">o</tspan>θ</text><path class="beam" d="M40 187.2L200 200L200 360L40 347.2Z"/><path class="beam" d="M200 200L500 284L500 324L200 360Z"/><path class="beam" d="M500 284L880 405.6L880 445.6L500 324Z"/><path class="ghost" d="M500 284L600 312"/><path class="ghost" d="M500 304L600 312"/><path class="ghost" d="M500 324L600 312"/><path d="M600 280V312" stroke="#1d3557" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="600" cy="312" r="5.5" fill="#fffdf7" stroke="#c8640f" stroke-width="2"/><path class="lead" d="M604 306L626 256"/><text class="s" x="612" y="248" data-etiqueta="foco">Sin ocular, los rayos se reunirían aquí</text><path class="ray" d="M40 187.2L200 200L500 284L880 405.6"/><path d="M128 194.2L116.6 198.6L117.5 188.1Z" fill="#c8640f"/><path d="M365 246.2L353 248.3L355.8 238.1Z" fill="#c8640f"/><path d="M709 350.9L696.9 352.6L700.1 342.5Z" fill="#c8640f"/><path class="ray" d="M40 267.2L200 280L500 304L880 425.6"/><path d="M128 274.2L116.6 278.6L117.5 268.1Z" fill="#c8640f"/><path d="M365 293.2L353.6 297.6L354.5 287.1Z" fill="#c8640f"/><path d="M709 370.9L696.9 372.6L700.1 362.5Z" fill="#c8640f"/><path class="ray" d="M40 347.2L200 360L500 324L880 445.6"/><path d="M128 354.2L116.6 358.6L117.5 348.1Z" fill="#c8640f"/><path d="M365 340.2L354.7 346.8L353.4 336.3Z" fill="#c8640f"/><path d="M709 390.9L696.9 392.6L700.1 382.5Z" fill="#c8640f"/><path class="lens" d="M200 152Q232 280 200 408Q168 280 200 152Z"/><path class="lens" d="M483 216L517 216Q493 280 517 344L483 344Q507 280 483 216Z"/><text class="b" x="224" y="130">Objetivo convergente</text><text class="g" x="224" y="156">f<tspan baseline-shift="sub" font-size="14">o</tspan> &gt; 0</text><text class="b" x="510" y="114" text-anchor="middle">Ocular divergente</text><text class="g" x="510" y="140" text-anchor="middle">f<tspan baseline-shift="sub" font-size="14">e</tspan> &lt; 0</text><path class="lead" d="M500 150V210"/><path d="M48 65L51.4 73.3L60.4 74L53.6 79.8L55.6 88.5L48 83.9L40.4 88.5L42.4 79.8L35.6 74L44.6 73.3Z" fill="#f2c230" stroke="#b17a10" stroke-width="1.5"/><text class="b" x="70" y="84">Luz de un mismo punto lejano</text><text class="s" x="70" y="105">rayos paralelos entre sí, inclinados</text><line class="ref" x1="60" y1="188.8" x2="186" y2="188.8"/><path class="arc" d="M156 188.8A96 96 0 0 1 155.7 196.5"/><text class="g" x="168" y="190.79999999999998">θ</text><line class="ref" x1="690" y1="344.8" x2="812" y2="344.8"/><path class="arc" d="M782 344.8A92 92 0 0 1 777.6 372.8"/><text class="g" x="790" y="364.8">θ′</text><text class="b" x="735" y="294.8">Haz emergente paralelo</text><text class="g" x="735" y="322.8" data-relacion="angulo">θ′ ≈ −(f<tspan baseline-shift="sub" font-size="14">o</tspan>/f<tspan baseline-shift="sub" font-size="14">e</tspan>) θ = +4θ</text><path class="dim" d="M200 420H600M200 412V428M500 414V426M600 412V428"/><path d="M200 420L209 415.7L209 424.3Z" fill="#1d3557"/><path d="M600 420L591 424.3L591 415.7Z" fill="#1d3557"/><text class="b" x="380" y="413" text-anchor="middle">f<tspan baseline-shift="sub" font-size="13">o</tspan> = 40 cm</text><text class="g" x="550" y="413" text-anchor="middle" style="font-size:18px">|f<tspan baseline-shift="sub" font-size="12">e</tspan>|</text><path class="dim" d="M200 452H500M200 444V460M500 444V460"/><path d="M200 452L209 447.7L209 456.3Z" fill="#1d3557"/><path d="M500 452L491 456.3L491 447.7Z" fill="#1d3557"/><text class="b" x="350" y="479" text-anchor="middle">d = f<tspan baseline-shift="sub" font-size="13">o</tspan> − |f<tspan baseline-shift="sub" font-size="13">e</tspan>| = 30 cm</text><text class="s i" x="34" y="508" data-escala="10">Horizontal a escala: 1 cm = 10 unidades del dibujo (en pantalla, los px dependen del ancho de la figura).</text><text class="s i" x="34" y="530">Ángulos positivos hacia arriba: θ y θ′ &lt; 0, igual signo → imagen derecha. Ángulos exagerados.</text>
</svg>
