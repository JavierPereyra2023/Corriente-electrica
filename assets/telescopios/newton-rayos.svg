<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">Reflector newtoniano: recorrido de la luz hasta el ocular lateral</title>
<desc id="desc">Pasos numerados: 1, la luz de un objeto lejano entra por la boca del tubo; 2, el espejo primario cóncavo del fondo, parabólico, la refleja convergente; 3, un espejo secundario plano a cuarenta y cinco grados la desvía hacia arriba sin cambiar su convergencia; 4, los rayos se cruzan en un punto de la imagen real intermedia, en el plano focal; los rayos provienen de un mismo punto lejano; 5, el ocular lateral los hace salir paralelos hacia el ojo.</desc>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1d3557" stroke-opacity=".05"/></pattern>
<linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#f7fcff"/><stop offset=".5" stop-color="#bcdcea"/><stop offset="1" stop-color="#f7fcff"/></linearGradient>
<linearGradient id="glassV" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f7fcff"/><stop offset=".5" stop-color="#bcdcea"/><stop offset="1" stop-color="#f7fcff"/></linearGradient>
<linearGradient id="mirror" x1="0" x2="1"><stop offset="0" stop-color="#e9eef2"/><stop offset=".45" stop-color="#9fb0bd"/><stop offset="1" stop-color="#4b5d6b"/></linearGradient>
<linearGradient id="tube" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1d3557" stop-opacity=".09"/><stop offset=".5" stop-color="#1d3557" stop-opacity=".025"/><stop offset="1" stop-color="#1d3557" stop-opacity=".09"/></linearGradient>
<style>
text{font-family:"Segoe UI",Arial,sans-serif;fill:#1d3557;font-size:18px}
.t{font-size:23px;font-weight:700}.b{font-weight:700}.s{font-size:16px;fill:#5c6b75}.i{font-style:italic}
.pill{font-size:15px;font-weight:700;fill:#7a4b06}.g{font-family:Georgia,serif;font-style:italic;font-size:21px}
.axis{stroke:#8795a0;stroke-width:1.4;stroke-dasharray:10 7}
.ray{fill:none;stroke:#c8640f;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.ghost{fill:none;stroke:#c8640f;stroke-width:1.8;stroke-dasharray:5 6;stroke-opacity:.55}
.beam{fill:#f2c230;fill-opacity:.2}
.lens{fill:url(#glass);stroke:#1d3557;stroke-width:2.4}
.lensV{fill:url(#glassV);stroke:#1d3557;stroke-width:2.4}
.lead{fill:none;stroke:#1d3557;stroke-width:1.3}
.ref{stroke:#5c6b75;stroke-width:1.3;stroke-dasharray:4 4}
.arc{fill:none;stroke:#1d3557;stroke-width:2}
.plane{stroke:#1d3557;stroke-width:1.6;stroke-dasharray:3 6;stroke-opacity:.7}
.tube{fill:url(#tube);stroke:#1d3557;stroke-opacity:.35;stroke-width:1.5}
.dim{stroke:#1d3557;stroke-width:1.6;fill:none}
</style></defs>
<rect width="1000" height="550" rx="14" fill="#fffdf7"/><rect width="1000" height="550" rx="14" fill="url(#grid)"/>
<rect x="0" y="0" width="8" height="550" fill="#f2c230"/>
<text class="t" x="34" y="46">Newton: el primario reúne, el secundario desvía</text><rect x="796" y="26" width="110" height="28" rx="14" fill="#fff6d8" stroke="#e0b84a"/><text class="pill" x="851" y="45" text-anchor="middle">reflector</text><path class="tube" d="M110 215H880V450H110Z"/><path d="M110 215H880V450H110" fill="none" stroke="#1d3557" stroke-width="3" stroke-opacity=".55"/><path class="tube" d="M570 215V146H630V215"/><line class="axis" x1="28" y1="330" x2="830.1" y2="330"/><line class="axis" x1="600" y1="330" x2="600" y2="150"/><path class="beam" d="M30 250L842 250L842 410L30 410Z"/><path class="beam" d="M842 250L574.6 304.6L638.5 368.5L842 410Z"/><path class="beam" d="M574.6 304.6L600 180L638.5 368.5Z"/><path class="beam" d="M600 180L610.2 130L589.8 130Z"/><path class="beam" d="M589.8 130L610.2 130L610.2 76L589.8 76Z"/><path d="M574.6 304.6L600 180L610.2 130L610.2 76" fill="none" stroke="#fffdf7" stroke-width="7" stroke-opacity=".9" stroke-linejoin="round"/><path d="M638.5 368.5L600 180L589.8 130L589.8 76" fill="none" stroke="#fffdf7" stroke-width="7" stroke-opacity=".9" stroke-linejoin="round"/><path class="ray" d="M30 250L842 250L574.6 304.6L600 180L610.2 130L610.2 76"/><path d="M476.6 250L465.6 255.3L465.6 244.7Z" fill="#c8640f"/><path d="M694.9 280L704.6 272.6L706.7 283Z" fill="#c8640f"/><path d="M588.6 236.1L591.5 247.9L581.2 245.8Z" fill="#c8640f"/><path class="ray" d="M30 410L842 410L638.5 368.5L600 180L589.8 130L589.8 76"/><path d="M476.6 410L465.6 415.3L465.6 404.7Z" fill="#c8640f"/><path d="M730 387.2L741.9 384.2L739.8 394.5Z" fill="#c8640f"/><path d="M617.3 264.8L624.7 274.5L614.3 276.6Z" fill="#c8640f"/><path d="M610.2 99L615.5 110L604.9 110Z" fill="#c8640f"/><path d="M589.8 99L595.1 110L584.5 110Z" fill="#c8640f"/><path d="M836.1 205Q855.9 330 836.1 455L851.1 455Q870.9 330 851.1 205Z" fill="url(#mirror)" stroke="#1d3557" stroke-width="2" data-primario="parabola"/><path d="M557 287L643 373" stroke="#4b5d6b" stroke-width="8" stroke-linecap="round"/><path d="M557 287L643 373" stroke="#e9eef2" stroke-width="2" stroke-linecap="round" data-secundario="1"/><path class="lensV" d="M556 130Q600 111 644 130Q600 149 556 130Z"/><line class="plane" x1="548" y1="180" x2="652" y2="180"/><circle cx="600" cy="180" r="5" fill="#1d3557"/><circle cx="46" cy="178" r="13" fill="#1d3557"/><text x="46" y="183.5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" style="fill:#fff">1</text><text class="b" x="68" y="172">Entra la luz</text><text class="s" x="68" y="193">de un objeto lejano</text><circle cx="930" cy="330" r="13" fill="#1d3557"/><text x="930" y="335.5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" style="fill:#fff">2</text><text class="b" x="702" y="486" >Primario cóncavo</text><text class="s" x="702" y="507">refleja y hace converger</text><path class="lead" d="M792 470L840.1 452"/><circle cx="556" cy="392" r="13" fill="#1d3557"/><text x="556" y="397.5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" style="fill:#fff">3</text><text class="b" x="330" y="486">Secundario plano a 45°</text><text class="s" x="330" y="507">solo cambia la dirección</text><path class="lead" d="M520 468L548 404"/><circle cx="520" cy="180.00000000000003" r="13" fill="#1d3557"/><text x="520" y="185.50000000000003" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" style="fill:#fff">4</text><text class="b" x="498" y="112" text-anchor="end" data-etiqueta="punto-imagen">Punto de la imagen real intermedia</text><text class="s" x="498" y="133" text-anchor="end" data-etiqueta="un-punto">Los rayos provienen de un mismo punto lejano.</text><path class="lead" d="M488 142L510 169"/><circle cx="680" cy="130.00000000000003" r="13" fill="#1d3557"/><text x="680" y="135.50000000000003" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" style="fill:#fff">5</text><text class="b" x="702" y="128">Ocular lateral</text><text class="s" x="702" y="149">el ojo se ubica arriba</text><text class="s i" x="34" y="530">Primario parabólico ideal y ocular como lente delgada. Se omiten soportes, sombra del secundario y ajuste de enfoque.</text>
</svg>
