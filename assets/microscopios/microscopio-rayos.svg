ext x="470" y="673" font-size="18">x=24 mm; y=-1.8 mm</text><text x="925" y="647" font-size="20" font-weight="bold" fill="#1d3557">③ Final virtual</text><text x="925" y="673" font-size="18">x=-40 mm; y=-9 mm</text><rect x="28" y="710" width="1344" height="86" rx="8" fill="#fff4cf" stroke="#d6c9af"/><text x="50" y="741" font-size="20"><tspan fill="#a85d12">1 Paralelo</tspan> · <tspan fill="#176d7c">2 Centro</tspan> · <tspan fill="#7955a2">3 Foco</tspan> · continuas: luz; discontinuas: prolongaciones virtuales.</text><text x="50" y="769" font-size="18">Punteado gris: eje o referencia hipotética. Misma escala en ambos ejes: 100 px = 10.0504732 mm.</text><text x="50" y="791" font-size="17">Secuencia explicativa: no representa la velocidad de la luz. Las lentes son símbolos de sus planos ópticos.</text></svg>
