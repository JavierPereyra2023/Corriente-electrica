<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="micro-title micro-desc"><title id="micro-title">5 · Imagen virtual final</title><desc id="micro-desc">Modelo calculado de lentes delgadas. La imagen intermedia está entre el foco objeto y el ocular. Los rayos emergentes divergen y sus prolongaciones coinciden en una imagen virtual final finita. Entre f1 y 2f1, el objetivo por sí solo forma una imagen real, invertida y aumentada. Algunos rayos tienen inclinación grande: las ecuaciones siguen mostrando el modelo paraxial ideal, cuya precisión física disminuye fuera de ángulos pequeños. Los trazos continuos son luz; las prolongaciones virtuales no son luz que retrocede.</desc><defs><clipPath id="micro-clip"><rect x="66" y="238" width="1268" height="378"/></clipPath><marker id="m-a85d12" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#a85d12"/></marker><marker id="m-176d7c" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#176d7c"/></marker><marker id="m-7955a2" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#7955a2"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#1d3557}</style><rect width="1400" height="820" rx="14" fill="#fffdf7"/><rect x="28" y="24" width="1344" height="119" rx="8" fill="#edf3f7"/><text x="50" y="64" font-size="29" font-weight="bold">5 · Imagen virtual final</text><text x="50" y="100" font-size="23">Las prolongaciones de los rayos emergentes coinciden en la imagen calculada.</text><g clip-path="url(#micro-clip)"><line x1="66" y1="388.195857" x2="1334" y2="388.195857" stroke="#87949c" stroke-dasharray="9 7"/><path d="M590.552417 243Q608.552417 427 590.552417 611Q572.552417 427 590.552417 243Z" fill="#dcebf2" fill-opacity=".7" stroke="#1d3557" stroke-width="2.5"/><path d="M988.543628 243Q1006.54363 427 988.543628 611Q970.543628 427 988.543