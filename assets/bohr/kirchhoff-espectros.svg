<svg xmlns="http://www.w3.org/2000/svg" width="820" height="490" viewBox="0 0 820 490" role="img"><title>Leyes espectroscópicas de Kirchhoff</title><defs><linearGradient id="rainbow"><stop stop-color="#6550a3"/><stop offset=".25" stop-color="#23669b"/><stop offset=".5" stop-color="#368d6a"/><stop offset=".75" stop-color="#c5ab25"/><stop offset="1" stop-color="#b84636"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b13c41"/></marker></defs><rect width="100%" height="100%" fill="#fffdf7"/><g font-family="Arial,sans-serif" fill="#1d3557"><text x="26" y="34" font-size="22" fill="#1d3557">KIRCHHOFF · DE LA FUENTE AL ESPECTRO</text><rect x="18" y="52" width="784" height="127" rx="6" fill="#f0f4f6"/><text x="32" y="77" font-size="18" fill="#1d3557">1 · CONTINUO</text><text x="32" y="102" font-size="14" fill="#56616a">Fuente caliente y densa: intervalo de longitudes de onda.</text><rect x="35" y="121" width="96" height="37" rx="5" fill="#cbaa61"/><text x="42" y="144" font-size="12" fill="#152838">fuente densa</text><line x1="140" y1="139" x2="335" y2="139" stroke="#b99a48" stroke-width="4" /><path d="M350 115 L380 159 L320 159 Z" fill="#d7e7ef" stroke="#6c8ca2"/><text x="322" y="175" font-size="12" fill="#56616a">prisma</text><line x1="386" y1="139" x2="485" y2="139" stroke="#7e929f" stroke-width="2" /><rect x="502" y="114" width="264" height="48" fill="url(#rainbow)"/><rect x="18" y="187" width="784" height="127" rx="6" fill="#f0f4f6"/><text x="32" y="212" font-size="18" fill="#1d3557">2 · EMISIÓN</text><text x="32" y="237" font-size="14" fill="#56616a">Gas poco denso excitado: líneas brillantes sobre fondo oscuro.</text><rect x="35" y="256" width="96" height="37" rx="5" fill="#c07496"/><text x="42" y="279" font-size="12" fill="#152838">gas excitado</text><line x1="140" y1="274" x2="335" y2="274" stroke="#b99a48" stroke-width="4" /><path d="M350 250 L380 294 L320 294 Z" fill="#d7e7ef" stroke="#6c8ca2"/><text x="322" y="310" font-size="12" fill="#56616a">prisma</text><line x1="386" y1="274" x2="485" y2="274" stroke="#7e929f" stroke-width="2" /><rect x="502" y="249" width="264" height="48" fill="#111923"/><line x1="538.96" y1="251" x2="538.96" y2="295" stroke="#8462cf" stroke-width="5" /><line x1="612.88" y1="251" x2="612.88" y2="295" stroke="#238da5" stroke-width="5" /><line x1="710.56" y1="251" x2="710.56" y2="295" stroke="#b83c3e" stroke-width="5" /><rect x="18" y="322" width="784" height="127" rx="6" fill="#f0f4f6"/><text x="32" y="347" font-size="18" fill="#1d3557">3 · ABSORCIÓN</text><text x="32" y="372" font-size="14" fill="#56616a">Fuente continua detrás de gas más frío: menos luz en ciertas líneas.</text><rect x="35" y="391" width="96" height="37" rx="5" fill="#cbaa61"/><text x="42" y="414" font-size="12" fill="#152838">fuente densa</text><line x1="140" y1="409" x2="335" y2="409" stroke="#b99a48" stroke-width="4" /><rect x="185" y="388" width="112" height="42" rx="6" fill="#dce7ed" stroke="#7997a9"/><text x="196" y="414" font-size="12" fill="#1d3557">gas más frío</text><path d="M350 385 L380 429 L320 429 Z" fill="#d7e7ef" stroke="#6c8ca2"/><text x="322" y="445" font-size="12" fill="#56616a">prisma</text><line x1="386" y1="409" x2="485" y2="409" stroke="#7e929f" stroke-width="2" /><rect x="502" y="384" width="264" height="48" fill="url(#rainbow)"/><line x1="538.96" y1="386" x2="538.96" y2="430" stroke="#111923" stroke-width="5" /><line x1="612.88" y1="386" x2="612.88" y2="430" stroke="#111923" stroke-width="5" /><line x1="710.56" y1="386" x2="710.56" y2="430" stroke="#111923" stroke-width="5" /><text x="26" y="478" font-size="13" fill="#56616a">Montajes simplificados · líneas ilustrativas · no representan intensidades medidas</text></g></svg>
