<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img"><title>Modelo histórico de Bohr</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#b13c41"/></marker></defs><rect width="820" height="390" fill="#fffdf7"/><g font-family="Arial,sans-serif" fill="#1d3557"><text x="26" y="34" font-size="22">BOHR · REPRESENTACIÓN HISTÓRICA</text><g fill="none" stroke="#718c9e" stroke-width="2"><circle cx="204" cy="215" r="36"/><circle cx="204" cy="215" r="78"/><circle cx="204" cy="215" r="120"/></g><circle cx="204" cy="215" r="13" fill="#c28e23"/><text x="199" y="220" font-size="18" fill="white">+</text><text x="181" y="264" font-size="14">núcleo</text><text x="249" y="217" font-size="15">n = 1</text><text x="289" y="220" font-size="15">n = 2</text><text x="333" y="216" font-size="15">n = 3</text><circle cx="204" cy="95" r="7" fill="#1d3557"/><text x="220" y="88" font-size="14">electrón en estado excitado</text><line x1="204" y1="102" x2="204" y2="137" stroke="#b13c41" stroke-width="3" marker-end="url(#arrow)"/><path d="M405 159 Q416 142 427 159 T449 159 T471 159 T493 159 T515 159" fill="none" stroke="#b13c41" stroke-width="3"/><text x="405" y="190" font-size="16" fill="#b13c41">Fotón emitido</text><text x="405" y="222" font-size="18">3 → 2: el átomo pierde energía</text><text x="405" y="252" font-size="16">E fotón = E inicial − E final</text><rect x="405" y="277" width="373" height="52" rx="4" fill="#edf3f7"/><text x="416" y="300" font-size="14">Órbitas permitidas en el modelo de Bohr.</text><text x="416" y="320" font-size="14">No son trayectorias verificadas del electrón.</text><text x="26" y="376" font-size="14" fill="#56616a">Esquema sin escala · La flecha representa un cambio de estado.</text></g></svg>
