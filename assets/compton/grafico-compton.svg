<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">Corrimiento Compton frente al ángulo y frente a uno menos coseno del ángulo</title>
<desc id="desc">Dos gráficos representan las mismas predicciones. A la izquierda, delta lambda en picómetros frente a theta en grados: una curva creciente desde cero hasta 4,852620 picómetros. A la derecha, delta lambda frente a uno menos coseno de theta: una recta de pendiente 2,426310 picómetros. Puntos destacados para cero, sesenta, noventa, ciento veinte y ciento ochenta grados.</desc>
