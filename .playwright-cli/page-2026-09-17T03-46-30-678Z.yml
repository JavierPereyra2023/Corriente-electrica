      - paragraph [ref=e5]: Sistemas Multi Física · Profesor Javier Pereyra
      - heading "Propagación de ondas mecánicas" [level=1] [ref=e6]
      - paragraph [ref=e7]: De la soga y el sonido a los fenómenos que preparan el estudio de Maxwell.
      - generic [ref=e8]:
        - generic [ref=e9]: "Curso: Secundaria superior"
        - generic [ref=e10]: "Tema: Ondas mecánicas"
        - generic [ref=e11]: "Unidades: m, s, Hz, m/s"
    - generic [ref=e12]:
      - heading "1 Idea inicial" [level=2] [ref=e13]:
        - generic [ref=e14]: "1"
        - text: Idea inicial
      - paragraph [ref=e15]: "Una onda mecánica es una perturbación que se propaga en un medio material: soga, agua, aire, resorte o suelo. Transporta energía e información, pero no traslada todo el medio de un lugar a otro."
      - figure "Cada punto de la soga oscila cerca de su equilibrio mientras el pulso avanza." [ref=e16]:
        - paragraph [ref=e17]: Animación 1 · propagación
        - generic "Onda transversal y propagación" [ref=e18]
      - generic [ref=e20]:
        - generic [ref=e21]: "TransversalLa oscilación es perpendicular al avance. Ejemplo: soga tensa."
        - generic [ref=e22]: "LongitudinalLa oscilación es paralela al avance. Ejemplo: sonido en el aire."
    - generic [ref=e23]:
      - heading "2 Magnitudes y ecuaciones" [level=2] [ref=e24]:
        - generic [ref=e25]: "2"
        - text: Magnitudes y ecuaciones
      - paragraph [ref=e26]: "Amplitud A: máximo alejamiento del equilibrio. Longitud de onda λ: distancia entre dos crestas consecutivas. Período T: tiempo de una oscilación. Frecuencia f: oscilaciones por segundo. Velocidad v: rapidez de propagación."
      - 'figure "Primero mirá el patrón sin rótulos: la línea punteada es el nivel de equilibrio y la onda se repite hacia la derecha." [ref=e27]':
        - img "Esquema estático de una onda transversal con línea de equilibrio, crestas y valles, aún sin etiquetas" [ref=e28]
      - 'figure "Los nombres aparecen de a uno: seguí cada flecha antes de pasar a la siguiente referencia." [ref=e30]':
        - paragraph [ref=e31]: Animación 2 · referencias del esquema
        - 'generic "Referencias de una onda: equilibrio, cresta, valle, amplitud y longitud de onda" [ref=e32]'
      - generic [ref=e34]: f = 1 / T
      - generic [ref=e35]: v = λ · f = λ / T
