      - paragraph [ref=e30]:
        - text: "Si sacudimos el extremo de una soga, cada pequeña porción de la soga se mueve alrededor de su posición de equilibrio. Sin embargo, el “pulso” llega al otro extremo:"
        - strong [ref=e31]: se propagó una perturbación
        - text: .
      - generic [ref=e32]:
        - strong [ref=e33]: "Onda mecánica:"
        - text: perturbación que se propaga en un medio material y transporta energía e información, sin trasladar el medio entero junto con ella. El medio puede ser una soga, agua, aire, un resorte o el suelo.
      - paragraph [ref=e34]: "Una buena analogía es la “ola” de una tribuna: las personas no recorren el estadio, pero el patrón de levantarse y sentarse sí lo hace. La analogía tiene un límite: en una onda física hay fuerzas entre las partes del medio."
      - figure "En una onda transversal de soga, las partes del medio oscilan perpendicularmente a la dirección de propagación." [ref=e35]:
        - img "Esquema de una onda transversal que se propaga por una soga, con las partes del medio oscilando verticalmente." [ref=e37]:
          - generic [ref=e40]: propagación
          - generic [ref=e41]: La partícula marcada oscila arriba y abajo; la onda avanza hacia la derecha.
          - generic [ref=e42]: posición de equilibrio
