    - generic [ref=e369]:
      - heading "11 Actividades" [level=2] [ref=e370]:
        - generic [ref=e371]: "11"
        - text: Actividades
      - paragraph [ref=e372]: En los ejercicios numéricos escribí datos, ecuación, reemplazo, unidad e interpretación física.
      - list [ref=e373]:
        - listitem [ref=e374]: Explicá con tus palabras por qué una onda en una soga transporta energía sin trasladar toda la soga.
        - listitem [ref=e376]: "Clasificá como mecánica o no mecánica: sonido, onda en el agua, luz de una linterna, onda sísmica. Justificá qué medio necesitan."
        - listitem [ref=e378]: Una fuente realiza 24 oscilaciones en 6,0 s. Calculá (f) y (T).
        - listitem [ref=e380]: "Una onda tiene (T=0{,}40,mathrm s). Hallá su frecuencia."
        - listitem [ref=e382]: "En una soga, (lambda=0{,}80,mathrm m) y (f=5{,}0,mathrm{Hz}). Calculá (v)."
        - listitem [ref=e384]: "Un sonido de (440,mathrm{Hz}) viaja en aire a (343,mathrm{m/s}). Hallá (lambda)."
        - listitem [ref=e386]: "Dos sonidos viajan por el mismo aire: uno tiene (250,mathrm{Hz}) y el otro (500,mathrm{Hz}). Compará sus velocidades y longitudes de onda."
        - listitem [ref=e388]: Una onda pasa de una cuerda a otra diferente. Indicá qué magnitud conserva la fuente y qué magnitudes pueden cambiar. Explicá la refracción.
        - listitem [ref=e390]: "Completá la tabla: para (v=12,mathrm{m/s}), calculá (lambda) si (f) vale 2 Hz, 3 Hz y 6 Hz. Graficá (lambda) en función de (f) y describí la relación."
        - listitem [ref=e392]: Dos parlantes emiten el mismo tono. En un punto se escucha muy poco. Proponé una explicación mediante interferencia destructiva y aclará por qué no desaparece la energía del sistema.
    - generic [ref=e394]:
      - heading "12 Preguntas para pensar" [level=2] [ref=e395]:
        - generic [ref=e396]: "12"
        - text: Preguntas para pensar
      - generic [ref=e397]:
        - strong [ref=e398]: ¿Qué cambia si sacudo una soga más rápido?
        - text: La frecuencia aumenta. Si la tensión no cambia mucho, la rapidez se mantiene aproximadamente y la longitud de onda disminuye.
      - generic [ref=e399]:
        - strong [ref=e400]: ¿Por qué a veces escuchamos detrás de una puerta?
        - text: "Porque el sonido se difracta: los frentes de onda se abren al atravesar la abertura. Es una buena oportunidad para distinguir “ver” de “oír” una fuente escondida."
      - generic [ref=e401]:
        - strong [ref=e402]: "Error frecuente:"
        - text: “Una amplitud mayor hace que la onda vaya más rápido”. En el modelo escolar usual de una soga lineal, la rapidez depende principalmente del medio y de la tensión, no de la amplitud. Amplitud y velocidad son magnitudes diferentes.
    - generic [ref=e403]: "Sugerencia docente: cerrar la clase con una tabla de comparación “onda mecánica / futura onda electromagnética”: ¿necesita medio?, ¿qué oscila?, ¿qué transporta?, ¿cómo se produce? Así la transición hacia Maxwell no aparece como un tema aislado."