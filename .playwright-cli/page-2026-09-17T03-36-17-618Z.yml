    - generic [ref=e88]:
      - heading "5 Ecuaciones" [level=2] [ref=e89]:
        - generic [ref=e90]: "5"
        - text: Ecuaciones
      - generic [ref=e91]:
        - generic [ref=e92]: "[\boxed{f= rac{1}{T}}]"
        - generic [ref=e93]:
          - paragraph [ref=e94]: Frecuencia y período son inversos. Si una oscilación dura menos, ocurren más oscilaciones por segundo.
          - paragraph [ref=e95]: "Si (T=0{,}20,mathrm s), entonces (f=1/0{,}20=5{,}0,mathrm{Hz})."
      - generic [ref=e96]:
        - generic [ref=e97]: "[\boxed{v=lambda f= rac{lambda}{T}}]"
        - generic [ref=e98]:
          - paragraph [ref=e99]: En un período, una cresta avanza una longitud de onda. Por eso (lambda/T) es la velocidad de propagación.
          - paragraph [ref=e100]: La fuente fija (f). En un medio dado, (v) depende del medio y (lambda) se ajusta para cumplir (v=lambda f).
      - generic [ref=e101]:
        - strong [ref=e102]: "No confundir:"
        - text: (v) no es la velocidad vertical de una partícula de la soga; mide el avance del patrón de onda.
    - generic [ref=e103]:
      - heading "6 Ejemplos resueltos" [level=2] [ref=e104]:
        - generic [ref=e105]: "6"
        - text: Ejemplos resueltos
      - generic [ref=e106]:
        - paragraph [ref=e107]:
          - strong [ref=e108]: "Problema:"
          - text: "una onda en una soga tiene (lambda=2{,}0,mathrm m) y (f=3{,}0,mathrm{Hz}). Hallá (v)."
        - paragraph [ref=e109]:
          - strong [ref=e110]: "Reemplazo:"
          - text: "(v=lambda f=(2{,}0,mathrm m)(3{,}0,mathrm{s^{-1}}))."
        - paragraph [ref=e111]:
          - strong [ref=e112]: "Resultado:"
          - text: "(\boxed{v=6{,}0,mathrm{m/s}}). Cada segundo el patrón avanza tres longitudes de (2{,}0,mathrm m)."
      - generic [ref=e113]:
        - paragraph [ref=e114]:
          - strong [ref=e115]: "Problema: sonido."
          - text: "Una nota de (680,mathrm{Hz}) viaja por aire a (340,mathrm{m/s}). Hallá (lambda)."
        - paragraph [ref=e116]:
          - strong [ref=e117]: "Despeje:"
          - text: "(lambda=v/f=340,mathrm{m/s}div680,mathrm{s^{-1}})."
        - paragraph [ref=e118]:
          - strong [ref=e119]: "Resultado:"
          - text: "(\boxed{lambda=0{,}50,mathrm m}). Una nota más aguda en el mismo aire tiene menor (lambda), no mayor velocidad."
    - generic [ref=e120]:
      - 'heading "7 Sonido: el aire también puede oscilar" [level=2] [ref=e121]':
        - generic [ref=e122]: "7"
        - text: "Sonido: el aire también puede oscilar"
      - paragraph [ref=e123]: "La membrana de un parlante vibra y crea compresiones y rarefacciones del aire. Esas variaciones de presión llegan al tímpano: así reconocemos un sonido."
      - figure "La compresión es una zona donde las partículas de aire están más juntas; la rarefacción, una zona donde quedan más separadas." [ref=e124]:
        - paragraph [ref=e125]: Animación 3 · sonido longitudinal
        - generic "Parlante que produce una onda longitudinal" [ref=e126]: Tu navegador no puede reproducir este video.
      - generic [ref=e128]:
        - strong [ref=e129]: "Puente hacia Maxwell:"
        - text: el sonido necesita un medio material. Las ondas electromagnéticas podrán propagarse incluso en el vacío.
    - generic [ref=e130]:
      - 'heading "8 Reflexión: la onda rebota" [level=2] [ref=e131]':
        - generic [ref=e132]: "8"
        - text: "Reflexión: la onda rebota"
      - paragraph [ref=e133]: En la reflexión, la onda encuentra un límite y vuelve al mismo medio. Cambia su dirección de propagación. Un pulso que llega al extremo de una soga y el eco son ejemplos cotidianos.
      - 'figure "Azul: onda que llega. Naranja: onda que vuelve. El límite no es un nuevo medio." [ref=e134]':
        - paragraph [ref=e135]: Animación 4 · reflexión
        - generic "Onda que se refleja en una pared" [ref=e136]: Tu navegador no puede reproducir este video.
    - generic [ref=e138]:
      - 'heading "9 Refracción: al cambiar de medio" [level=2] [ref=e139]':
        - generic [ref=e140]: "9"
        - text: "Refracción: al cambiar de medio"
      - paragraph [ref=e141]: En la refracción, una onda pasa de un medio a otro. La fuente continúa oscilando al mismo ritmo, por eso la frecuencia (f) se conserva. Si en el segundo medio la onda se propaga más lento, su longitud de onda se hace menor.
      - figure [ref=e142]:
        - paragraph [ref=e143]: Animación 5 · refracción
        - generic "Olas que pasan de agua profunda a agua poco profunda" [ref=e144]: Tu navegador no puede reproducir este video.
        - generic [ref=e145]:
          - strong [ref=e146]: "Leé de izquierda a derecha:"
          - text: en agua profunda hay menos frentes en la misma distancia; en agua poco profunda la onda va más lento y los frentes quedan más juntos. Se conserva (f), disminuyen (v) y (lambda).
      - generic [ref=e147]:
        - strong [ref=e148]: "Idea clave:"
        - text: refracción no es rebotar ni abrirse. Es un cambio de velocidad causado por el cambio de medio.
    - generic [ref=e149]:
      - 'heading "10 Difracción: al atravesar una abertura" [level=2] [ref=e150]':
        - generic [ref=e151]: "10"
        - text: "Difracción: al atravesar una abertura"
      - paragraph [ref=e152]: En la difracción, la onda no cambia de medio. Encuentra una abertura o bordea un obstáculo y, detrás de él, sus frentes se curvan y se expanden. Por eso podemos oír una voz detrás de una puerta entreabierta.
      - figure [ref=e153]:
        - paragraph [ref=e154]: Animación 6 · difracción
        - generic "Frentes de onda rectos que pasan por una abertura y se vuelven circulares" [ref=e155]: Tu navegador no puede reproducir este video.
        - generic [ref=e156]:
          - strong [ref=e157]: "Leé de izquierda a derecha:"
          - text: antes de la abertura los frentes son rectos; después, la abertura se comporta como una nueva fuente y aparecen frentes circulares. No cambió de medio.
      - generic [ref=e158]:
        - strong [ref=e159]: "Idea clave:"
        - text: difracción no es refracción. En la refracción cambia el medio; en la difracción cambia la geometría del paso disponible para la onda.
    - generic [ref=e160]:
      - 'heading "11 Interferencia constructiva: encuentro de pulsos" [level=2] [ref=e161]':
        - generic [ref=e162]: "11"
        - text: "Interferencia constructiva: encuentro de pulsos"
      - paragraph [ref=e163]: La interferencia es un fenómeno diferente y se estudia en esta sección propia. Cuando dos pulsos se encuentran, cada punto del medio tiene una elongación resultante igual a la suma algebraica de las elongaciones de ambos pulsos.
      - generic [ref=e164]:
        - generic [ref=e165]: "[\boxed{y_{mathrm R}=y_1+y_2}]"
        - generic [ref=e166]:
          - paragraph [ref=e167]:
            - text: "Si ambos pulsos desplazan el medio hacia el mismo lado, la amplitud resultante aumenta: hay"
            - strong [ref=e168]: interferencia constructiva
            - text: .
          - paragraph [ref=e169]: Es un efecto instantáneo mientras se superponen. No se forma un “pulso nuevo” permanente.
      - figure "Los pulsos azul y naranja se acercan. Durante el cruce, la curva dorada tiene mayor amplitud. Al terminar la superposición, ambos pulsos continúan su camino con su forma original." [ref=e170]:
        - paragraph [ref=e171]: Animación 7 · interferencia constructiva
        - generic "Dos pulsos que chocan, se suman temporalmente y continúan" [ref=e172]: Tu navegador no puede reproducir este video.
      - generic [ref=e174]:
        - strong [ref=e175]: "Lectura correcta:"
        - text: “en ese instante aumenta la amplitud resultante”. No significa que la energía desaparezca ni que los pulsos se queden pegados.
