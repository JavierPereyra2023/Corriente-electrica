      - paragraph [ref=e5]: Sistemas Multi Física - Profesor Javier Pereyra
      - heading "Propagación de ondas mecánicas" [level=1] [ref=e6]
      - paragraph [ref=e7]: Antes de estudiar las ondas electromagnéticas de Maxwell, describimos cómo una perturbación viaja en una soga, en el aire o en el agua.
      - generic [ref=e8]:
        - generic [ref=e9]:
          - strong [ref=e10]: "Curso:"
          - text: Secundaria superior
        - generic [ref=e11]:
          - strong [ref=e12]: "Tema:"
          - text: Ondas mecánicas
        - generic [ref=e13]:
          - strong [ref=e14]: "Unidades:"
          - text: m, s, Hz, m/s
    - generic [ref=e15]:
      - heading "1 Objetivos de aprendizaje" [level=2] [ref=e16]:
        - generic [ref=e17]: "1"
        - text: Objetivos de aprendizaje
      - generic [ref=e18]:
        - generic [ref=e19]:
          - strong [ref=e20]: Explicar
          - text: Distinguir una onda mecánica de un desplazamiento de materia.
        - generic [ref=e21]:
          - strong [ref=e22]: Reconocer
          - text: Amplitud, longitud de onda, período, frecuencia y velocidad.
        - generic [ref=e23]:
          - strong [ref=e24]: Calcular
          - text: Resolver problemas con (f=1/T), (v=lambda f) y (v=lambda/T).
        - generic [ref=e25]:
          - strong [ref=e26]: Interpretar
          - text: Explicar reflexión, refracción, difracción e interferencia constructiva.
    - generic [ref=e27]:
      - heading "2 Una perturbación que se propaga" [level=2] [ref=e28]:
        - generic [ref=e29]: "2"
        - text: Una perturbación que se propaga
      - paragraph [ref=e30]: Al sacudir una soga, cada parte se mueve alrededor de su posición de equilibrio, mientras el pulso llega al extremo opuesto. La onda transporta energía e información, pero no lleva toda la soga de un lado al otro.
      - generic [ref=e31]:
        - strong [ref=e32]: "Onda mecánica:"
        - text: perturbación que se propaga en un medio material. Puede viajar por una soga, el agua, el aire, un resorte o el suelo.
      - figure "Las partículas azules oscilan arriba y abajo; la perturbación avanza hacia la derecha." [ref=e33]:
        - paragraph [ref=e34]: Animación 1 · propagación
        - generic "Onda transversal que muestra propagación y oscilación" [ref=e35]: Tu navegador no puede reproducir este video.
    - generic [ref=e37]:
      - heading "3 Formas de oscilación" [level=2] [ref=e38]:
        - generic [ref=e39]: "3"
        - text: Formas de oscilación
      - generic [ref=e40]:
        - generic [ref=e41]:
          - strong [ref=e42]: Onda transversal
          - text: "La oscilación es perpendicular a la dirección de propagación. Ejemplo: una soga tensa."
        - generic [ref=e43]:
          - strong [ref=e44]: Onda longitudinal
          - text: "La oscilación es paralela a la dirección de propagación. Se alternan compresiones y rarefacciones. Ejemplo: el sonido en el aire."
      - generic [ref=e45]:
        - strong [ref=e46]: "Límite del dibujo senoidal:"
        - text: no significa que el aire suba y baje cuando oímos un sonido. En una onda sonora, el aire se comprime y se rareface en la dirección en que viaja el sonido.
    - generic [ref=e47]:
      - heading "4 Magnitudes de una onda" [level=2] [ref=e48]:
        - generic [ref=e49]: "4"
        - text: Magnitudes de una onda
      - paragraph [ref=e50]: La amplitud (A) mide el máximo alejamiento respecto del equilibrio. La longitud de onda (lambda) es la distancia entre dos puntos que están en la misma fase, por ejemplo dos crestas consecutivas.
      - figure "Primero ubicá el equilibrio; desde allí se mide la amplitud. Luego buscá una repetición completa para medir (lambda)." [ref=e51]:
        - paragraph [ref=e52]: Animación 2 · magnitudes
        - generic "Onda transversal que señala amplitud y longitud de onda" [ref=e53]: Tu navegador no puede reproducir este video.
