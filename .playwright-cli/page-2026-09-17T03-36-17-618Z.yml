    - generic [ref=e226]:
      - heading "13 Preguntas para pensar" [level=2] [ref=e227]:
        - generic [ref=e228]: "13"
        - text: Preguntas para pensar
      - generic [ref=e229]:
        - strong [ref=e230]: "Antes de responder, identificá la situación:"
        - text: ¿la onda vuelve al mismo medio? → reflexión. ¿pasa a otro medio? → refracción. ¿pasa por un hueco o rodea un borde? → difracción. ¿dos pulsos ocupan el mismo lugar a la vez? → interferencia.
      - generic [ref=e231]:
        - strong [ref=e232]: "Error frecuente:"
        - text: en la interferencia constructiva la amplitud aumenta solamente durante la superposición. Después del cruce, cada pulso sigue propagándose.
    - generic [ref=e233]: "Sugerencia docente: pausá cada animación en el momento señalado y pedí una frase de lectura: “qué hay antes, qué sucede en el límite o cruce y qué se observa después”."