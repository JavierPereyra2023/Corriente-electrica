      - list [ref=e205]:
        - listitem [ref=e206]: Explicá por qué una onda transporta energía sin trasladar todo el medio.
        - listitem [ref=e208]: "Clasificá como mecánica o electromagnética: sonido, luz, onda en agua y onda sísmica."
        - listitem [ref=e210]: Una fuente hace 24 oscilaciones en 6,0 s. Calculá (f) y (T).
