- main [ref=f1e2]:
  - article [ref=f1e3]:
    - generic [ref=f1e4]:
      - paragraph [ref=f1e5]: Sistemas Multi Física · Profesor Javier Pereyra
      - heading "Propagación de ondas mecánicas" [level=1] [ref=f1e6]
      - paragraph [ref=f1e7]: De la soga y el sonido a los fenómenos que preparan el estudio de Maxwell.
      - generic [ref=f1e8]:
        - generic [ref=f1e9]: "Curso: Secundaria superior"
        - generic [ref=f1e10]: "Tema: Ondas mecánicas"
        - generic [ref=f1e11]: "Unidades: m, s, Hz, m/s"
    - generic [ref=f1e12]:
      - heading "1 Idea inicial" [level=2] [ref=f1e13]:
        - generic [ref=f1e14]: "1"
        - text: Idea inicial
      - paragraph [ref=f1e15]: "Una onda mecánica es una perturbación que se propaga en un medio material: soga, agua, aire, resorte o suelo. Transporta energía e información, pero no traslada todo el medio de un lugar a otro."
      - figure "Cada punto de la soga oscila cerca de su equilibrio mientras el pulso avanza." [ref=f1e16]:
        - paragraph [ref=f1e17]: Animación 1 · propagación
        - generic "Onda transversal y propagación" [ref=f1e18]
      - generic [ref=f1e20]:
        - generic [ref=f1e21]: "TransversalLa oscilación es perpendicular al avance. Ejemplo: soga tensa."
        - generic [ref=f1e22]: "LongitudinalLa oscilación es paralela al avance. Ejemplo: sonido en el aire."
    - generic [ref=f1e23]:
      - heading "2 Magnitudes y ecuaciones" [level=2] [ref=f1e24]:
        - generic [ref=f1e25]: "2"
        - text: Magnitudes y ecuaciones
      - paragraph [ref=f1e26]: "Amplitud A: máximo alejamiento del equilibrio. Longitud de onda λ: distancia entre dos crestas consecutivas. Período T: tiempo de una oscilación. Frecuencia f: oscilaciones por segundo. Velocidad v: rapidez de propagación."
      - 'figure "Primero mirá el patrón sin rótulos: la línea punteada es el nivel de equilibrio y la onda se repite hacia la derecha." [ref=f1e27]':
        - img "Esquema estático de una onda transversal con línea de equilibrio, crestas y valles, aún sin etiquetas" [ref=f1e28]
      - 'figure "Los nombres aparecen de a uno: seguí cada flecha antes de pasar a la siguiente referencia." [ref=f1e30]':
        - paragraph [ref=f1e31]: Animación 2 · referencias del esquema
        - 'generic "Referencias de una onda: equilibrio, cresta, valle, amplitud y longitud de onda" [active] [ref=f1e32]'
      - generic [ref=f1e34]: f = 1 / T
      - generic [ref=f1e35]: v = λ · f = λ / T
      - table [ref=f1e36]:
        - rowgroup [ref=f1e37]:
          - row [ref=f1e38]:
            - columnheader "Magnitud" [ref=f1e39]
            - columnheader "Unidad SI" [ref=f1e40]
