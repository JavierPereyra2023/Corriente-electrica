    - generic [ref=f1e63]:
      - heading "3 Problemas resueltos" [level=2] [ref=f1e64]:
        - generic [ref=f1e65]: "3"
        - text: Problemas resueltos
      - generic [ref=f1e66]: "1. Soga: λ = 2,0 m y f = 3,0 Hz. Entonces v = λ·f = 2,0 m · 3,0 Hz = 6,0 m/s."
      - generic [ref=f1e67]: "2. Sonido: f = 680 Hz y v = 340 m/s. Entonces λ = v/f = 340/680 = 0,50 m. En el mismo aire, una frecuencia mayor produce menor λ."
    - generic [ref=f1e68]:
      - 'heading "4 Sonido: compresiones y rarefacciones" [level=2] [ref=f1e69]':
        - generic [ref=f1e70]: "4"
        - text: "Sonido: compresiones y rarefacciones"
      - paragraph [ref=f1e71]: "La membrana de un parlante vibra: comprime el aire al avanzar y lo rareface al retroceder. El sonido necesita medio material; será una diferencia fundamental con las ondas electromagnéticas."
      - 'figure "Compresión: aire más junto. Rarefacción: aire más separado." [ref=f1e72]':
        - paragraph [ref=f1e73]: Animación 3 · sonido longitudinal
        - generic "Parlante y onda longitudinal" [ref=f1e74]
    - generic [ref=f1e76]:
      - 'heading "5 Reflexión: la onda rebota" [level=2] [ref=f1e77]':
        - generic [ref=f1e78]: "5"
        - text: "Reflexión: la onda rebota"
      - paragraph [ref=f1e79]: "La onda encuentra un límite y vuelve por el mismo medio: cambia su dirección. Ejemplos: eco y pulso en el extremo de una soga."
      - 'figure "Azul: onda incidente. Naranja: onda reflejada." [ref=f1e80]':
        - paragraph [ref=f1e81]: Animación 4 · reflexión
        - generic "Onda incidente y reflejada" [ref=f1e82]
    - generic [ref=f1e84]:
      - 'heading "6 Refracción: cambia el medio" [level=2] [ref=f1e85]':
        - generic [ref=f1e86]: "6"
        - text: "Refracción: cambia el medio"
      - paragraph [ref=f1e87]: Una onda pasa de un medio a otro. La fuente sigue vibrando con la misma frecuencia; cambian la velocidad y la longitud de onda. En agua menos profunda las olas viajan más lento y sus frentes quedan más juntos.
      - 'figure "Leé de izquierda a derecha: misma f; menor v y menor λ en el agua poco profunda." [ref=f1e88]':
        - paragraph [ref=f1e89]: Animación 5 · refracción
        - generic "Refracción entre agua profunda y poco profunda" [ref=f1e90]
      - generic [ref=f1e92]: "Refracción ≠ reflexión: no rebota; atraviesa una frontera entre dos medios."
    - generic [ref=f1e93]:
      - 'heading "7 Difracción: pasa por una abertura" [level=2] [ref=f1e94]':
        - generic [ref=f1e95]: "7"
        - text: "Difracción: pasa por una abertura"
      - paragraph [ref=f1e96]: La onda no cambia de medio. Al pasar por un hueco o bordear un obstáculo, sus frentes se curvan y se expanden. Por eso escuchamos una voz detrás de una puerta entreabierta.
      - 'figure "Antes: frentes rectos. Después: la abertura se comporta como nueva fuente de frentes circulares." [ref=f1e97]':
        - paragraph [ref=f1e98]: Animación 6 · difracción
        - generic "Frentes rectos que pasan por una abertura y se vuelven circulares" [ref=f1e99]
      - generic [ref=f1e101]: "Difracción ≠ refracción: aquí no cambió el medio; cambió la geometría del paso disponible."
    - generic [ref=f1e102]:
      - 'heading "8 Interferencia constructiva: encuentro de pulsos" [level=2] [ref=f1e103]':
        - generic [ref=f1e104]: "8"
        - text: "Interferencia constructiva: encuentro de pulsos"
      - paragraph [ref=f1e105]: Esta situación se estudia aparte de reflexión, refracción y difracción. Cuando dos pulsos ocupan el mismo lugar al mismo instante, se superponen.
      - generic [ref=f1e106]: y resultante = y₁ + y₂
      - paragraph [ref=f1e107]: "Si ambos desplazan el medio hacia el mismo lado, sus amplitudes se suman: durante ese instante la amplitud resultante aumenta. Después del cruce, los pulsos siguen su camino con su forma original."
      - figure "La curva dorada es el resultado instantáneo; los pulsos azul y naranja no se detienen ni quedan unidos." [ref=f1e108]:
        - paragraph [ref=f1e109]: Animación 7 · interferencia constructiva
        - generic "Dos pulsos que se suman durante un encuentro y después continúan" [ref=f1e110]
      - generic [ref=f1e112]: "Lectura correcta: “en ese instante aumenta la amplitud resultante”. No aparece una onda permanente nueva."
    - generic [ref=f1e113]:
      - heading "9 Actividades" [level=2] [ref=f1e114]:
        - generic [ref=f1e115]: "9"
        - text: Actividades
      - list [ref=f1e116]:
        - listitem [ref=f1e117]: Explicá por qué una onda transporta energía sin trasladar todo el medio.
        - listitem [ref=f1e119]: "Clasificá como mecánica o electromagnética: sonido, luz, onda en agua y onda sísmica."
        - listitem [ref=f1e121]: Una fuente hace 24 oscilaciones en 6,0 s. Calculá f y T.
        - listitem [ref=f1e123]: Para T = 0,40 s, hallá f.
        - listitem [ref=f1e125]: Para λ = 0,80 m y f = 5,0 Hz, hallá v.
        - listitem [ref=f1e127]: Un sonido de 440 Hz viaja a 343 m/s. Hallá λ.
        - listitem [ref=f1e129]: Compará las longitudes de onda de sonidos de 250 Hz y 500 Hz en el mismo aire.
        - listitem [ref=f1e131]: Dibujá una reflexión en el extremo de una soga.
        - listitem [ref=f1e133]: Explicá la refracción de olas al llegar a agua poco profunda.
        - listitem [ref=f1e135]: Explicá la difracción de una voz detrás de una puerta.
    - generic [ref=f1e137]:
      - heading "10 Preguntas para pensar" [level=2] [ref=f1e138]:
        - generic [ref=f1e139]: "10"
        - text: Preguntas para pensar
      - generic [ref=f1e140]: "Clasificá antes de explicar: ¿vuelve al mismo medio? reflexión. ¿pasa a otro medio? refracción. ¿pasa por un hueco? difracción. ¿dos pulsos ocupan el mismo lugar? interferencia."
      - generic [ref=f1e141]: "Error frecuente: la interferencia constructiva aumenta la amplitud solo mientras los pulsos se superponen; después continúan propagándose."
    - generic [ref=f1e142]: "Sugerencia docente: pausá cada animación y pedí al grupo una lectura en tres pasos: antes, durante y después del fenómeno."