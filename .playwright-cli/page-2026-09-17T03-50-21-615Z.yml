            - cell "Máximo desplazamiento." [ref=f2e46]
          - row [ref=f2e47]:
            - cell "λ" [ref=f2e48]
            - cell "m" [ref=f2e49]
            - cell "Repetición espacial." [ref=f2e50]
          - row [ref=f2e51]:
            - cell "T" [ref=f2e52]
            - cell "s" [ref=f2e53]
            - cell "Una oscilación completa." [ref=f2e54]
          - row [ref=f2e55]:
            - cell "f" [ref=f2e56]
            - cell "Hz" [ref=f2e57]
            - cell "Oscilaciones por segundo." [ref=f2e58]
