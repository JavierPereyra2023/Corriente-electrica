- main [ref=f2e2]:
  - article [ref=f2e3]:
    - generic [ref=f2e4]:
      - paragraph [ref=f2e5]: Sistemas Multi Física · Profesor Javier Pereyra
      - heading "Propagación de ondas mecánicas" [level=1] [ref=f2e6]
      - paragraph [ref=f2e7]: De la soga y el sonido a los fenómenos que preparan el estudio de Maxwell.
      - generic [ref=f2e8]:
        - generic [ref=f2e9]: "Curso: Secundaria superior"
        - generic [ref=f2e10]: "Tema: Ondas mecánicas"
        - generic [ref=f2e11]: "Unidades: m, s, Hz, m/s"
    - generic [ref=f2e12]:
      - heading "1 Idea inicial" [level=2] [ref=f2e13]:
        - generic [ref=f2e14]: "1"
        - text: Idea inicial
      - paragraph [ref=f2e15]: "Una onda mecánica es una perturbación que se propaga en un medio material: soga, agua, aire, resorte o suelo. Transporta energía e información, pero no traslada todo el medio de un lugar a otro."
      - figure "Cada punto de la soga oscila cerca de su equilibrio mientras el pulso avanza." [ref=f2e16]:
        - paragraph [ref=f2e17]: Animación 1 · propagación
        - generic "Onda transversal y propagación" [ref=f2e18]
      - generic [ref=f2e20]:
        - generic [ref=f2e21]: "TransversalLa oscilación es perpendicular al avance. Ejemplo: soga tensa."
        - generic [ref=f2e22]: "LongitudinalLa oscilación es paralela al avance. Ejemplo: sonido en el aire."
    - generic [ref=f2e23]:
      - heading "2 Magnitudes y ecuaciones" [level=2] [ref=f2e24]:
        - generic [ref=f2e25]: "2"
        - text: Magnitudes y ecuaciones
      - paragraph [ref=f2e26]: "Amplitud A: máximo alejamiento del equilibrio. Longitud de onda λ: distancia entre dos crestas consecutivas. Período T: tiempo de una oscilación. Frecuencia f: oscilaciones por segundo. Velocidad v: rapidez de propagación."
      - 'figure "Primero mirá el patrón sin rótulos: la línea punteada es el nivel de equilibrio y la onda se repite hacia la derecha." [ref=f2e27]':
        - img "Esquema estático de una onda transversal con línea de equilibrio, crestas y valles, aún sin etiquetas" [ref=f2e28]
      - 'figure "Los nombres aparecen de a uno: seguí cada flecha antes de pasar a la siguiente referencia." [ref=f2e30]':
        - paragraph [ref=f2e31]: Animación 2 · referencias del esquema
        - 'generic "Referencias de una onda: equilibrio, cresta, valle, amplitud y longitud de onda" [ref=f2e32]'
      - generic [ref=f2e34]: f = 1 / T
      - generic [ref=f2e35]: v = λ · f = λ / T
      - table [ref=f2e36]:
        - rowgroup [ref=f2e37]:
          - row [ref=f2e38]:
            - columnheader "Magnitud" [ref=f2e39]
            - columnheader "Unidad SI" [ref=f2e40]
            - columnheader "Interpretación" [ref=f2e41]
        - rowgroup [ref=f2e42]:
          - row [ref=f2e43]:
            - cell "A" [ref=f2e44]
